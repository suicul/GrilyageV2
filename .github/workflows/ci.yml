name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace packages/shared
      - run: npm run lint --workspaces --if-present
      - run: npx tsc --noEmit
        working-directory: apps/api
      - run: npx tsc --noEmit
        working-directory: apps/web

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grilyage
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: grilyage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace packages/shared
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://grilyage:testpass@localhost:5432/grilyage_test
      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://grilyage:testpass@localhost:5432/grilyage_test
      - name: Run API tests
        run: npm test --workspace apps/api
        env:
          DATABASE_URL: postgresql://grilyage:testpass@localhost:5432/grilyage_test
          JWT_ACCESS_SECRET: test_access_secret_32chars_minimum_ok
          JWT_REFRESH_SECRET: test_refresh_secret_32chars_minimum_ok
          STAFF_JWT_ACCESS_SECRET: test_staff_access_32chars_minimum_ok
          STAFF_JWT_REFRESH_SECRET: test_staff_refresh_32chars_minimum_ok
          SMTP_HOST: localhost
          SMTP_PORT: 1025

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker build (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: grilyage-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Docker build (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: grilyage-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
