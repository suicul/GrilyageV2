resolver 127.0.0.11 valid=10s ipv6=off;

upstream web {
    zone upstream_web 64k;
    server web:3000 resolve;
}

upstream api {
    zone upstream_api 64k;
    server api:4000 resolve;
}

server {
    listen 80;
    server_name grillyage.ru www.grillyage.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name grillyage.ru www.grillyage.ru;

    ssl_certificate /etc/letsencrypt/live/grillyage.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grillyage.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /dev/stdout;
    error_log /dev/stderr;

    client_max_body_size 10M;

    # Maintenance mode toggle: touch /etc/nginx/maintenance.on to enable
    if (-f /etc/nginx/maintenance.on) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html;
        try_files /maintenance.html =503;
    }

    # Next.js static files
    location /_next/static {
        proxy_pass http://web;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket for staff orders + mobile
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiveKit WebRTC signaling
    location /livekit/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Uploaded images
    location /uploads/ {
        proxy_pass http://api;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health check
    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # Everything else to Next.js
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
