port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  port_range_start: 7881
  port_range_end: 7882
  use_external_ip: true
  stun_servers:
    - "stun.l.google.com:19302"
turn:
  enabled: true
  domain: grillyage.ru
  tls_port: 5349
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
logging:
  level: info
  # Use certbot certs
ssl:
  certificate: /etc/letsencrypt/live/grillyage.ru/fullchain.pem
  key: /etc/letsencrypt/live/grillyage.ru/privkey.pem
