name: mobile_shared
description: Shared Dart code between mobile and courier Flutter apps
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  flutter_riverpod: ">=2.6.1 <4.0.0"
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
