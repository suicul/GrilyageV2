name: grilyage
description: Грильяж — мобильное приложение
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.9.2
  go_router: ^17.3.0
