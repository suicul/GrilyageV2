<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="800" viewBox="0 0 1800 800">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1810;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A2F25;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0F0A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#D4A853;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#D4A853;stop-opacity:0" />
