  <!-- Decorative circles -->
  <circle cx="200" cy="100" r="80" fill="none" stroke="#D4A853" stroke-width="0.5" opacity="0.2"/>
  <circle cx="1600" cy="650" r="120" fill="none" stroke="#D4A853" stroke-width="0.5" opacity="0.15"/>
  <circle cx="900" cy="400" r="300" fill="none" stroke="#D4A853" stroke-width="0.3" opacity="0.08"/>
  <!-- Lines -->
  <line x1="100" y1="180" x2="400" y2="180" stroke="#D4A853" stroke-width="0.5" opacity="0.2"/>
  <line x1="1400" y1="620" x2="1700" y2="620" stroke="#D4A853" stroke-width="0.5" opacity="0.2"/>
</svg>
